name: Small Business API CI

# Push to any branch and every pull request. The paths filter keeps CI quiet
# when only unrelated files (notes, other projects) change.
on:
  push:
    paths:
      - "project_1/small-business-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "project_1/small-business-api/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    # One real Postgres instance for the test suite — conftest.py refuses to
    # run against anything but a database called small_business_test_db.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: small_business_test_db
        ports:
          - 5432:5432
        # health check gates the next step: the job waits until Postgres is ready.
        options: >-
          --health-cmd "pg_isready -U app_user -d small_business_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        # Local dev runs on 3.13; 3.14 catches issues from the newer interpreter early.
        python-version: ["3.13"]

    defaults:
      run:
        working-directory: project_1/small-business-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip downloads keyed by requirements.txt, so repeat runs are fast.
          cache: pip
          cache-dependency-path: project_1/small-business-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Settings() needs these loaded as real env vars; none is a real secret.
          SECRET_KEY: ci-secret-only-used-in-tests
          DATABASE_URL: postgresql+psycopg://app_user:ci_password@localhost:5432/small_business_test_db
          TEST_DATABASE_URL: postgresql+psycopg://app_user:ci_password@localhost:5432/small_business_test_db
          REDIS_URL: redis://localhost:6379/0
          ALGORITHM: HS256
        run: pytest -q
